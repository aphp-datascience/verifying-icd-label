# Jean Zay config for the ICD-10 synonym qualifier, self-training curriculum.
#
# Placeholders (phase1_df_pos.pkl, /lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/synonym/stepA, best_model_stepA.pt) are substituted per step by
# jz/slurm/synonym_step.slurm. Kept out of the repo's own configs/config.yml so the
# colleague's file stays untouched and no hard-coded token travels.
#
# Two deliberate departures from the AP-HP config:
#   - the backbone is the PUBLIC almanach/camembertav2-base rather than the restricted
#     PARTAGES repo, so every result is reproducible outside the consortium (the March-May
#     encoder results showed the two backbones within a hundredth of each other);
#   - continue_training is False: each step retrains from scratch on the accumulated
#     positives, which is the standard self-training formulation and avoids drifting the
#     model onto the small newly-validated subset.

vars:
  hf_token: ""                       # public backbone: no token needed
  data_path: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/synonym/V2_avril_2026/"
  df_pos: "phase1_df_pos.pkl"
  df_neg: "df_neg.pkl"
  val_dataset: "phase1_test_inclusion.pkl"   # identical across steps, so the curve is comparable
  output_path: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/synonym/stepA/"
  seed: 42

model_params:
  model_name: "/lustre/fsmisc/dataset/HuggingFace_Models/almanach/camembertav2-base"
  hf_token: ${vars.hf_token}
  hidden_layer: 512
  activation: "gelu"
  dropout: 0.1
  pooling: "mean"
  sigma: 0.
  freeze_encoder: False

model:
  "@factory": "camembert_classifier"
  model_name: ${model_params.model_name}
  hf_token: ${model_params.hf_token}
  hidden_layer: ${model_params.hidden_layer}
  activation: ${model_params.activation}
  dropout: ${model_params.dropout}
  pooling: ${model_params.pooling}
  sigma: ${model_params.sigma}
  freeze_encoder: ${model_params.freeze_encoder}

warmup_config:
  warmup_epochs: 2
  encoder_learning_rate: 1e-6
  classifier_learning_rate: 1e-3
  weight_decay: 1e-2
  sampling_probs:
    hard: 1.0
    cat: 0.
    bloc: 0.7

train_config:
  train_epochs: 15
  encoder_learning_rate: 1e-5
  classifier_learning_rate: 5e-5
  weight_decay: 1e-4
  sampling_probs:
    hard: 0.
    cat: 0.
    bloc: 0.9

train:
  model: ${model}
  hf_token: ${vars.hf_token}
  data_path: ${vars.data_path}
  df_pos: ${vars.df_pos}
  df_neg: ${vars.df_neg}
  val_dataset: ${vars.val_dataset}
  batch_size: 180
  max_length: 200
  warmup_config: ${warmup_config}
  train_config: ${train_config}
  continue_training: False
  output_path: ${vars.output_path}
  model_weights: "best_model_stepA.pt"
  seed: ${vars.seed}
  exp_dir: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/synonym/stepA/calib"

infere:
  model: ${model}
  hf_token: ${vars.hf_token}
  data_path: ${vars.data_path}
  dataset: "phase1_test_inclusion.pkl"
  batch_size: 768
  max_length: 512
  output_path: ${vars.output_path}
  model_weights: "best_model_stepA.pt"
  seed: ${vars.seed}
  exp_dir: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/synonym/stepA/calib"
