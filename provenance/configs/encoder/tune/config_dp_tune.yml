# Condition RAW du papier : DP seul, train v3 non pondéré, backbone PARTAGES.
#
# Dérivée de config_dp.yml, avec trois écarts assumés :
#   - PAS de données synthétiques (doc_classifier_syn / syn_data retirés) : le raw est le
#     contrôle, il n'apprend que sur MISTRAL v3 ;
#   - validation sur le DEV v3, jamais sur PARHAF -> pas de fuite de test (PARHAF n'est
#     évalué qu'une fois, à la fin, hors sélection de modèle) ;
#   - backbone PARTAGES (adapté au domaine), comme le modèle de synonyme.
#
# Placeholders substitués par jz/slurm/encoder_raw.slurm : /lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/encoder_v3 PARTAGES-dev/PARTAGES-camembertav2-base /lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/encoder/tune @MAXSTEP@.

vars:
  train_path: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/encoder_v3/train"
  val_path: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/encoder_v3/dev"
  label_attr: ["dp"]
  max_step: 2000
  validation_interval: 500

nlp:
  '@core': pipeline
  lang: eds
  components:
    doc_classifier:
      '@factory': eds.doc_classifier
      heads:
        dp:
          '@misc': eds.single_label_head
          labels: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/encoder_v3/valid_labels_dp.pkl"
          class_weights: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/encoder_v3/label_freq_dict_dp.pkl"
          loss: "ce"
          hidden_size: 1024
          activation_mode: "gelu"
          dropout_rate: 0.05
          layer_norm: true
          loss_weight: 1.0
      embedding:
        '@factory': eds.doc_pooler
        pooling_mode: "attention"
        embedding:
          '@factory': eds.transformer
          model: "PARTAGES-dev/PARTAGES-camembertav2-base"
          window: 256

scorer:
  diag:
    '@metrics': eds.doc_classif
    label_attr: ${vars.label_attr}
  batch_size: "150 docs"
  speed: true

optimizer:
  "@core": optimizer !draft
  optim: torch.optim.AdamW
  total_steps: ${vars.max_step}
  groups:
  - selector: "doc_classifier[.]embedding[.]embedding"
    lr:
      "@schedules": linear
      warmup_rate: 0.15
      start_value: 0
      max_value: 3e-05
    weight_decay: 0.0
  - selector: ".*"
    lr:
      "@schedules": linear
      warmup_rate: 0.1
      start_value: 0
      max_value: 0.0005
    weight_decay: 0.0
  module: ${ nlp }

train_data:
  data:
    '@readers': parquet
    path: ${vars.train_path}
    converter: omop
    doc_attributes: ${vars.label_attr}
  shuffle: fragment
  batch_size: "32 docs"
  sub_batch_size: "12000 words"
  pipe_names: "doc_classifier"

val_data:
  '@readers': parquet
  path: ${vars.val_path}
  converter: omop
  doc_attributes: ${vars.label_attr}

logger:
- json
- '@loggers': rich
  fields:
    step: {}
    "per_pipe/(.*)/results/loss":
      goal: lower_is_better
      format: "{:.2e}"
      goal_wait: 2
      name: "loss"
    "validation/(.*?)/dp/micro/f$":
      goal: higher_is_better
      format: "{:.2%}"
      goal_wait: 1
      name: "dp_mi_f"

train:
  nlp: ${nlp}
  train_data:
    - ${ train_data }
  val_data: ${val_data}
  scorer: ${scorer}
  optimizer: ${optimizer}
  loss_scales:
    doc_classifier: 1.
  max_steps: ${vars.max_step}
  validation_interval: ${vars.validation_interval}
  grad_max_norm: 1.0
  output_dir: "/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/encoder/tune"
  mixed_precision: "bf16"
  num_workers: 8
  logger: ${logger}
  cpu: False

# 🔎 TUNING (Optuna) — gros run, macro F1 dev, régularisation + capacité + LR.
# python -m edsnlp.tune --config configs/config_dp_tune.yml
tuning:
  output_dir: '/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/encoder/tune/tuning'
  checkpoint_dir: '/lustre/fsn1/projects/rech/sxf/uhq31wo/CU2/runs/encoder/tune/tuning_ckpt'
  n_trials: 20
  two_phase_tuning: false
  metric: "diag.dp.macro.f"
  hyperparameters:
    "optimizer.groups.0.lr.max_value":
      alias: "bert_lr"
      type: "float"
      low: 1.0e-5
      high: 8.0e-5
      log: true
    "optimizer.groups.1.lr.max_value":
      alias: "head_lr"
      type: "float"
      low: 5.0e-5
      high: 1.0e-3
      log: true
    "optimizer.groups.0.lr.warmup_rate":
      alias: "warmup"
      type: "float"
      low: 0.05
      high: 0.3
      step: 0.05
    "nlp.components.doc_classifier.heads.dp.dropout_rate":
      alias: "dropout"
      type: "float"
      low: 0.05
      high: 0.5
      step: 0.05
    "optimizer.groups.1.weight_decay":
      alias: "head_wd"
      type: "categorical"
      choices: [0.0, 0.001, 0.01, 0.1]
    "nlp.components.doc_classifier.heads.dp.hidden_size":
      alias: "hidden_size"
      type: "categorical"
      choices: [512, 1024, 2048]
